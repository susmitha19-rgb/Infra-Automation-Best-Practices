trigger:
  branches:
    include:
      - main
  paths:
    include:
      - live/dev/aws/network/**
      - templates/**
      - azure-pipelines-aws.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - live/dev/aws/network/**
      - templates/**
      - azure-pipelines-aws.yml

variables:
  - name: AWS_REGION
    value: us-east-1
  - name: AWS_TFSTATE_BUCKET
    value: replace-with-state-bucket
  - name: AWS_TFSTATE_REGION
    value: us-east-1

extends:
  template: templates/terraform-pipeline.yml
  parameters:
    cloud: aws
    workingDirectory: live/dev/aws/network
    tfvarsFile: terraform.tfvars.example
    backendKey: aws/dev/network.tfstate
    environment: terraform-aws-dev-network
    awsServiceConnection: replace-with-aws-service-connection
