trigger:
  branches:
    include:
      - main
  paths:
    include:
      - live/dev/azure/network/**
      - templates/**
      - azure-pipelines-azure.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - live/dev/azure/network/**
      - templates/**
      - azure-pipelines-azure.yml

variables:
  - name: AZURE_TFSTATE_RESOURCE_GROUP
    value: replace-with-state-resource-group
  - name: AZURE_TFSTATE_STORAGE_ACCOUNT
    value: replacewithstateaccount
  - name: AZURE_TFSTATE_CONTAINER
    value: tfstate

extends:
  template: templates/terraform-pipeline.yml
  parameters:
    cloud: azure
    workingDirectory: live/dev/azure/network
    tfvarsFile: terraform.tfvars.example
    backendKey: azure/dev/network.tfstate
    environment: terraform-azure-dev-network
    azureServiceConnection: replace-with-azure-service-connection
